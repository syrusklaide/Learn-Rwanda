<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Speak Rwanda</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap');

  :root {
    --ink: #171512;
    --ivory: #F2E9D8;
    --clay: #C25B37;
    --clay-dark: #8f3f24;
    --forest: #3F6B4C;
    --savannah: #D9A441;
    --lake: #2C6E8E;
    --text-rgb: 242,233,216;
    --bg: var(--ink);
    --text: var(--ivory);
    --line: rgba(var(--text-rgb),0.14);
    --display: 'Space Grotesk', sans-serif;
    --body: 'Work Sans', sans-serif;
  }

  #app[data-theme="light"] {
    --bg: #FAF5EA;
    --text: #211E1A;
    --text-rgb: 33,30,26;
  }
  #app[data-theme="light"] .ambient { opacity: 0.65; }

  .theme-toggle {
    position: absolute; top: 16px; right: 16px; z-index: 5;
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(var(--text-rgb),0.06); color: var(--text); font-size: 16px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform .2s ease, background .2s ease;
  }
  .theme-toggle:hover { background: rgba(var(--text-rgb),0.12); transform: rotate(15deg); }
  .theme-toggle:active { transform: scale(0.9); }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--body);
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    transition: background .3s ease, color .3s ease;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    position: relative;
    overflow: hidden;
    isolation: isolate;
    transition: background .3s ease, color .3s ease;
  }

  .ambient { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .ambient svg { position: absolute; opacity: 0.5; }
  .ambient .spiral-a { top: -60px; right: -80px; width: 260px; height: 260px; animation: spin-slow 90s linear infinite; }
  .ambient .spiral-b { bottom: -100px; left: -90px; width: 280px; height: 280px; animation: spin-slow-rev 120s linear infinite; }
  @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes spin-slow-rev { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
  .ambient .glow-a {
    position: absolute; top: 6%; left: 8%; width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(194,91,55,0.22), transparent 70%);
    animation: drift-a 14s ease-in-out infinite;
  }
  .ambient .glow-b {
    position: absolute; bottom: 4%; right: 6%; width: 240px; height: 240px; border-radius: 50%;
    background: radial-gradient(circle, rgba(63,107,76,0.22), transparent 70%);
    animation: drift-b 16s ease-in-out infinite;
  }
  @keyframes drift-a { 0%,100% { transform: translate(0,0); } 50% { transform: translate(18px,14px); } }
  @keyframes drift-b { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-16px,-12px); } }

  .content { position: relative; z-index: 1; }

  .screen { display: none; padding: 22px 20px 40px; }
  .screen.active { display: block; }
  .screen.enter-right { animation: slideInRight .42s cubic-bezier(.22,.9,.3,1); }
  .screen.enter-left { animation: slideInLeft .42s cubic-bezier(.22,.9,.3,1); }
  @keyframes slideInRight { from { opacity:0; transform: translateX(28px);} to {opacity:1; transform:none;} }
  @keyframes slideInLeft { from { opacity:0; transform: translateX(-28px);} to {opacity:1; transform:none;} }

  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .brand svg { width: 34px; height: 34px; flex-shrink: 0; }
  .brand h1 { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 0; letter-spacing: 0.2px; }
  .logo-poly { animation: logo-pulse 5s ease-in-out infinite; transform-origin: center; }
  @keyframes logo-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

  .eyebrow {
    font-family: var(--body); font-size: 11px; text-transform: uppercase;
    letter-spacing: 1.6px; color: var(--savannah); margin: 0 0 18px 0; opacity: .9;
  }
  .intro { font-size: 14.5px; line-height: 1.55; color: rgba(var(--text-rgb),0.78); margin: 0 0 26px; }

  .auth-box { margin-top: 40px; }
  .auth-field {
    width: 100%; padding: 13px 14px; border-radius: 12px; margin-bottom: 12px;
    border: 1px solid var(--line); background: rgba(var(--text-rgb),0.05); color: var(--text);
    font-family: var(--body); font-size: 14px;
  }
  .auth-field::placeholder { color: rgba(var(--text-rgb),0.4); }
  .auth-field:focus { outline: none; border-color: var(--savannah); }
  .auth-error { color: var(--clay); font-size: 12.5px; margin-bottom: 10px; min-height: 16px; }
  .auth-toggle { text-align: center; margin-top: 16px; font-size: 12.5px; color: rgba(var(--text-rgb),0.6); }
  .auth-toggle button { background: none; border: none; color: var(--savannah); font-weight: 600; cursor: pointer; font-size: 12.5px; }

  .stagger > * { opacity: 0; animation: pop-up .5s cubic-bezier(.22,1.1,.3,1) forwards; }
  .stagger > *:nth-child(1) { animation-delay: .05s; }
  .stagger > *:nth-child(2) { animation-delay: .13s; }
  .stagger > *:nth-child(3) { animation-delay: .21s; }
  .stagger > *:nth-child(4) { animation-delay: .29s; }
  .stagger > *:nth-child(5) { animation-delay: .37s; }
  .stagger > *:nth-child(6) { animation-delay: .45s; }
  @keyframes pop-up { from { opacity:0; transform: translateY(14px) scale(.97);} to {opacity:1; transform:none;} }

  .dest-list { display: flex; flex-direction: column; gap: 14px; }
  .dest-card {
    position: relative; border-radius: 18px; padding: 18px;
    display: flex; align-items: center; gap: 14px;
    border: 1px solid var(--line); cursor: pointer; overflow: hidden;
    transition: transform .2s cubic-bezier(.2,.9,.3,1.3), border-color .2s ease, box-shadow .2s ease;
    background: rgba(var(--text-rgb),0.03);
  }
  .dest-card:active { transform: scale(0.97); }
  .dest-card:not(.locked):hover { border-color: rgba(var(--text-rgb),0.32); box-shadow: 0 6px 22px rgba(0,0,0,0.28); transform: translateY(-2px); }
  .dest-card.locked { opacity: 0.5; cursor: default; }
  .dest-card.locked:active, .dest-card.locked:hover { transform: none; box-shadow: none; }
  .dest-card.unlocking { animation: unlock-burst .7s ease; }
  @keyframes unlock-burst {
    0% { transform: scale(1); }
    30% { transform: scale(1.04); box-shadow: 0 0 0 0 rgba(217,164,65,0.5); }
    60% { box-shadow: 0 0 0 16px rgba(217,164,65,0); }
    100% { transform: scale(1); }
  }

  .medallion {
    width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #F2E9D8; position: relative; z-index: 1;
    transition: transform .3s ease;
  }
  .dest-card:not(.locked):hover .medallion { transform: rotate(-8deg) scale(1.06); }
  .medallion svg { width: 30px; height: 30px; }

  .dest-info { position: relative; z-index: 1; flex: 1; min-width: 0; }
  .dest-info h3 { font-family: var(--display); font-size: 16px; margin: 0 0 3px; }
  .dest-info p { font-size: 12.5px; margin: 0; color: rgba(var(--text-rgb),0.7); }

  .progress-track { width: 100%; height: 5px; border-radius: 3px; background: rgba(var(--text-rgb),0.12); margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--savannah), var(--clay)); width: 0%; transition: width .6s cubic-bezier(.3,.9,.3,1); }
  .dest-progress { font-size: 10.5px; color: var(--savannah); margin-top: 5px; font-weight: 600; }
  .lock-icon { position: relative; z-index: 1; font-size: 18px; opacity: 0.7; }

  .badge-shelf { display: flex; gap: 10px; margin-top: 24px; }
  .badge-slot {
    width: 46px; height: 46px; border-radius: 50%; border: 1.5px dashed var(--line);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    transition: transform .4s cubic-bezier(.3,1.6,.4,1), border-color .3s ease, background .3s ease;
  }
  .badge-slot.earned { border-style: solid; border-color: var(--savannah); background: rgba(217,164,65,0.14); animation: badge-land .5s cubic-bezier(.3,1.6,.4,1); }
  @keyframes badge-land { 0% { transform: scale(0) rotate(-30deg);} 70% { transform: scale(1.25) rotate(8deg);} 100% { transform: scale(1) rotate(0);} }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .signout-btn { background: none; border: none; color: rgba(var(--text-rgb),0.5); font-size: 12px; cursor: pointer; }

  .quick-nav { display: flex; gap: 10px; margin-bottom: 20px; }
  .quick-nav-btn {
    flex: 1; padding: 11px 10px; border-radius: 14px; border: 1px solid var(--line);
    background: rgba(var(--text-rgb),0.05); color: var(--text); font-family: var(--body);
    font-size: 12.5px; font-weight: 600; cursor: pointer; transition: background .2s ease, transform .15s ease;
  }
  .quick-nav-btn:hover { background: rgba(var(--text-rgb),0.1); }
  .quick-nav-btn:active { transform: scale(0.96); }

  .poi-list { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .poi-card {
    border-radius: 16px; padding: 14px 16px; border: 1px solid var(--line);
    background: rgba(var(--text-rgb),0.03); display: flex; gap: 12px; align-items: flex-start;
  }
  .poi-icon { font-size: 22px; flex-shrink: 0; margin-top: 2px; }
  .poi-info h3 { font-family: var(--display); font-size: 15px; margin: 0 0 3px; }
  .poi-info p { font-size: 12px; margin: 0 0 4px; color: rgba(var(--text-rgb),0.7); line-height: 1.4; }
  .poi-distance { font-size: 11px; font-weight: 700; color: var(--savannah); }

  .location-state { text-align: center; padding: 30px 10px; font-size: 13.5px; color: rgba(var(--text-rgb),0.7); }
  .location-state button { margin-top: 14px; }

  .star-row { display: flex; gap: 8px; margin: 16px 0 20px; justify-content: center; }
  .star-btn { font-size: 30px; background: none; border: none; cursor: pointer; opacity: 0.35; transition: opacity .15s, transform .15s; }
  .star-btn.active { opacity: 1; transform: scale(1.1); }
  .feedback-textarea {
    width: 100%; min-height: 90px; padding: 12px 14px; border-radius: 12px; margin-bottom: 14px;
    border: 1px solid var(--line); background: rgba(var(--text-rgb),0.05); color: var(--text);
    font-family: var(--body); font-size: 13.5px; resize: vertical;
  }
  .feedback-textarea::placeholder { color: rgba(var(--text-rgb),0.4); }
  .feedback-textarea:focus { outline: none; border-color: var(--savannah); }
  .feedback-success { text-align: center; padding: 40px 10px; }
  .feedback-success .big-check { font-size: 46px; margin-bottom: 12px; }

  .back-btn {
    background: none; border: none; color: var(--text); font-family: var(--body);
    font-size: 13px; padding: 0; margin-bottom: 14px; cursor: pointer; opacity: 0.75;
    display: flex; align-items: center; gap: 6px; transition: opacity .15s, transform .15s;
  }
  .back-btn:hover { opacity: 1; transform: translateX(-2px); }

  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .word-card { aspect-ratio: 3/4; border-radius: 16px; position: relative; perspective: 900px; cursor: pointer; }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform .55s cubic-bezier(.25,.9,.25,1.15);
    transform-style: preserve-3d;
  }
  .word-card:active .card-inner { transform: scale(0.96) rotateY(0deg); }
  .word-card.flipped .card-inner { transform: rotateY(180deg); }
  .word-card.flipped:active .card-inner { transform: rotateY(180deg) scale(0.96); }

  .card-face {
    position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 12px; text-align: center; border: 1px solid var(--line);
  }
  .card-front { background: rgba(var(--text-rgb),0.06); transition: box-shadow .2s ease; }
  .word-card:hover .card-front { box-shadow: 0 4px 18px rgba(0,0,0,0.25); }
  .card-front .glyph { font-size: 34px; margin-bottom: 8px; transition: transform .3s cubic-bezier(.3,1.5,.4,1); }
  .word-card:hover .glyph { transform: scale(1.12) rotate(-4deg); }
  .card-front .kiny { font-family: var(--display); font-weight: 700; font-size: 17px; }
  .card-front .done-tick {
    position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--forest); font-size: 11px; display: flex; align-items: center; justify-content: center;
    animation: tick-pop .35s cubic-bezier(.3,1.6,.4,1);
  }
  @keyframes tick-pop { from { transform: scale(0);} to { transform: scale(1);} }

  .card-back { background: var(--ivory); color: var(--ink); transform: rotateY(180deg); justify-content: flex-start; padding-top: 16px; }
  .card-back .eng { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--clay-dark); font-weight: 600;}
  .card-back .kiny-small { font-family: var(--display); font-weight: 700; font-size: 15px; margin: 4px 0 8px; }
  .card-back .fact { font-size: 11px; line-height: 1.4; color: #4a463f; margin-bottom: 8px; }

  .action-row { display: flex; gap: 10px; margin-top: auto; align-items: center; }

  .mic-btn {
    width: 46px; height: 46px; border-radius: 50%; border: none;
    background: var(--clay); color: white; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
    transition: transform .15s ease, background .2s ease;
  }
  .mic-btn:active { transform: scale(0.9); }
  .mic-btn.listening { animation: pulse 1s infinite; background: var(--forest); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(63,107,76,.55);} 70%{box-shadow:0 0 0 14px rgba(63,107,76,0);} 100%{box-shadow:0 0 0 0 rgba(63,107,76,0);} }

  .listen-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(var(--text-rgb),0.08); color: var(--ink); font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .15s ease, background .2s ease;
  }
  .listen-btn:hover { background: rgba(var(--text-rgb),0.15); }
  .listen-btn:active { transform: scale(0.9); }
  .listen-btn.speaking { animation: pulse 1s infinite; }

  .score-wrap { display: flex; align-items: center; gap: 6px; margin-top: 6px; min-height: 16px; }
  .score-ring-svg { width: 22px; height: 22px; transform: rotate(-90deg); flex-shrink: 0; opacity: 0; transition: opacity .2s; }
  .score-ring-svg.show { opacity: 1; }
  .score-ring-bg { fill: none; stroke: rgba(28,26,23,0.12); stroke-width: 3; }
  .score-ring-fg { fill: none; stroke: var(--forest); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 56.5; stroke-dashoffset: 56.5; transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1), stroke 1s; }
  .score-line { font-size: 10.5px; font-weight: 600; }
  .retry-hint { font-size: 9.5px; color: rgba(var(--text-rgb),0.55); margin-top: 2px; }

  .overlay {
    position: absolute; inset: 0; background: rgba(23,21,18,0.9);
    display: none; align-items: center; justify-content: center; z-index: 10; padding: 30px;
    backdrop-filter: blur(2px);
  }
  .overlay.active { display: flex; animation: overlay-in .3s ease; }
  @keyframes overlay-in { from { opacity: 0; } to { opacity: 1; } }
  .badge-modal { text-align: center; position: relative; }
  .badge-modal.pop { animation: modal-pop .5s cubic-bezier(.3,1.5,.35,1); }
  @keyframes modal-pop { from { opacity:0; transform: scale(.75) translateY(10px);} to {opacity:1; transform:none;} }
  .big-medal {
    width: 104px; height: 104px; margin: 0 auto 18px; border-radius: 50%;
    background: radial-gradient(circle, var(--savannah), var(--clay-dark));
    display: flex; align-items: center; justify-content: center; font-size: 44px;
    border: 3px solid var(--ivory); position: relative;
    animation: medal-spin-in .7s cubic-bezier(.25,1.4,.3,1);
  }
  @keyframes medal-spin-in { from { transform: rotate(-200deg) scale(0.3); opacity: 0; } to { transform: none; opacity: 1; } }
  .big-medal::after {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 2px solid rgba(217,164,65,0.5); animation: ring-pulse 1.8s ease-out infinite;
  }
  @keyframes ring-pulse { 0% { transform: scale(0.9); opacity: 0.8; } 100% { transform: scale(1.35); opacity: 0; } }
  .badge-modal h2 { font-family: var(--display); margin: 0 0 6px; font-size: 21px; }
  .badge-modal p { font-size: 13px; color: rgba(242,233,216,0.75); margin: 0 0 22px; }

  .primary-btn {
    background: var(--clay); color: white; border: none; padding: 12px 26px;
    border-radius: 24px; font-family: var(--body); font-weight: 600; font-size: 14px; cursor: pointer;
    transition: transform .15s ease, background .2s ease; width: 100%;
  }
  .primary-btn:hover { background: var(--clay-dark); }
  .primary-btn:active { transform: scale(0.97); }

  .confetti-piece {
    position: absolute; top: 40%; left: 50%; width: 8px; height: 8px; border-radius: 2px;
    animation: confetti-fall 1.4s ease-out forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }

  .nav-hint { text-align: center; font-size: 10.5px; color: rgba(var(--text-rgb),0.35); margin-top: 30px; }
  .loading-note { text-align: center; font-size: 13px; color: rgba(var(--text-rgb),0.5); margin-top: 60px; }
</style>
</head>
<body>
<div id="app">
  <div class="ambient" aria-hidden="true">
    <div class="glow-a"></div>
    <div class="glow-b"></div>
    <svg class="spiral-a" viewBox="0 0 100 100"><g fill="none" stroke="#D9A441" stroke-width="1.4" opacity="0.35">
      <polygon points="50,6 94,50 50,94 6,50"/><polygon points="50,22 78,50 50,78 22,50"/><polygon points="50,38 62,50 50,62 38,50"/>
    </g></svg>
    <svg class="spiral-b" viewBox="0 0 100 100"><g fill="none" stroke="#3F6B4C" stroke-width="1.4" opacity="0.3">
      <polygon points="50,4 96,50 50,96 4,50"/><polygon points="50,20 80,50 50,80 20,50"/><polygon points="50,34 66,50 50,66 34,50"/>
    </g></svg>
  </div>
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode">🌙</button>
  <div class="content" id="content">
    <p class="loading-note">Loading Speak Rwanda…</p>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://gvcxvsixcmnxlhtnvnch.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Isrx852pyoovlYBZTG9fwQ_WT4x5uT0';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const content = document.getElementById('content');
  const appEl = document.getElementById('app');
  const themeToggle = document.getElementById('theme-toggle');
  const THEME_KEY = 'speak-rwanda-theme';

  function applyTheme(theme) {
    appEl.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'light' ? '☀️' : '🌙';
    localStorage.setItem(THEME_KEY, theme);
  }
  themeToggle.onclick = () => applyTheme(appEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

  let session = null;
  let destinations = [];
  let cardsByDestination = {};
  let progressByDestination = {};
  let earnedBadgeDestIds = new Set();

  init();

  async function init() {
    const { data } = await supabase.auth.getSession();
    session = data.session;
    supabase.auth.onAuthStateChange((_event, newSession) => { session = newSession; render(); });
    render();
  }

  async function render() {
    if (!session) { renderAuth(); return; }
    content.innerHTML = `<p class="loading-note">Loading your destinations…</p>`;
    await loadContentAndProgress();
    renderHome();
  }

  async function loadContentAndProgress() {
    const { data: dests } = await supabase.from('destinations').select('*').order('sort_order');
    destinations = dests || [];

    const { data: cards } = await supabase.from('cards').select('*').order('sort_order');
    cardsByDestination = {};
    (cards || []).forEach(c => {
      if (!cardsByDestination[c.destination_id]) cardsByDestination[c.destination_id] = [];
      cardsByDestination[c.destination_id].push(c);
    });

    const { data: progressRows } = await supabase.from('user_progress').select('*').eq('user_id', session.user.id);
    progressByDestination = {};
    (progressRows || []).forEach(p => { progressByDestination[p.destination_id] = p.cards_completed; });

    const { data: badgeRows } = await supabase.from('user_badges').select('destination_id').eq('user_id', session.user.id);
    earnedBadgeDestIds = new Set((badgeRows || []).map(b => b.destination_id));
  }

  function isUnlocked(dest) {
    if (dest.unlock_rule === 'open') return true;
    if (dest.unlock_rule === 'requires_n_destinations') return earnedBadgeDestIds.size >= dest.unlock_count;
    return true;
  }

  function renderAuth(mode = 'signin') {
    content.innerHTML = `
      <div class="screen active">
        <div class="brand">
          <svg viewBox="0 0 40 40" class="logo-poly"><polygon points="20,2 36,20 20,38 4,20" fill="none" stroke="#D9A441" stroke-width="2"/><polygon points="20,10 30,20 20,30 10,20" fill="#C25B37"/></svg>
          <h1>Speak Rwanda</h1>
        </div>
        <p class="eyebrow">Kinyarwanda · Culture · Wildlife</p>
        <p class="intro">Sign in to track your progress, badges, and pronunciation scores across sessions.</p>
        <div class="auth-box">
          <input class="auth-field" id="auth-email" type="email" placeholder="Email" autocomplete="email" />
          <input class="auth-field" id="auth-password" type="password" placeholder="Password" autocomplete="${mode === 'signin' ? 'current-password' : 'new-password'}" />
          ${mode === 'signup' ? `<input class="auth-field" id="auth-confirm-password" type="password" placeholder="Confirm password" autocomplete="new-password" />` : ''}
          <div class="auth-error" id="auth-error"></div>
          <button class="primary-btn" id="auth-submit">${mode === 'signin' ? 'Sign in' : 'Create account'}</button>
          <div class="auth-toggle">
            ${mode === 'signin' ? `New here? <button id="auth-switch">Create an account</button>` : `Already have an account? <button id="auth-switch">Sign in</button>`}
          </div>
        </div>
      </div>`;
    document.getElementById('auth-switch').onclick = () => renderAuth(mode === 'signin' ? 'signup' : 'signin');
    document.getElementById('auth-submit').onclick = () => handleAuthSubmit(mode);
  }

  async function handleAuthSubmit(mode) {
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const errorEl = document.getElementById('auth-error');
    errorEl.style.color = 'var(--clay)';
    errorEl.textContent = '';
    if (!email || !password) { errorEl.textContent = 'Enter both an email and a password.'; return; }

    if (mode === 'signup') {
      const confirmPassword = document.getElementById('auth-confirm-password').value;
      if (password !== confirmPassword) { errorEl.textContent = 'Passwords do not match.'; return; }
      if (password.length < 6) { errorEl.textContent = 'Password should be at least 6 characters.'; return; }
    }

    // Wherever this page is actually hosted (GitHub Pages, localhost, etc.) — never hardcoded.
    const redirectUrl = window.location.origin + window.location.pathname;

    const { error } = mode === 'signin'
      ? await supabase.auth.signInWithPassword({ email, password })
      : await supabase.auth.signUp({ email, password, options: { emailRedirectTo: redirectUrl } });

    if (error) { errorEl.textContent = error.message; return; }
    if (mode === 'signup') {
      errorEl.style.color = 'var(--forest)';
      errorEl.textContent = 'Account created — check your email if confirmation is required, then sign in.';
    }
  }

  function renderHome() {
    const destCardsHtml = destinations.map(d => {
      const total = (cardsByDestination[d.id] || []).length;
      const done = progressByDestination[d.id] || 0;
      const unlocked = isUnlocked(d);
      const pct = total ? Math.round((done / total) * 100) : 0;

      if (!unlocked) {
        return `
          <div class="dest-card locked">
            <div class="medallion" style="background:var(--lake)">
              <svg viewBox="0 0 24 24" fill="none" stroke="#F2E9D8" stroke-width="2"><path d="M3 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg>
            </div>
            <div class="dest-info">
              <h3>${d.title}</h3>
              <p>Earn ${d.unlock_count} badges to unlock</p>
            </div>
            <div class="lock-icon">🔒</div>
          </div>`;
      }
      return `
        <div class="dest-card" data-dest-id="${d.id}">
          <div class="medallion" style="background:var(--clay)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#F2E9D8" stroke-width="2"><path d="M8 12h8M12 8v8"/></svg>
          </div>
          <div class="dest-info">
            <h3>${d.title}</h3>
            <p>${d.description || ''}</p>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="dest-progress">${done} / ${total} cards</div>
          </div>
        </div>`;
    }).join('');

    const badgeShelfHtml = destinations.map(d => `<div class="badge-slot ${earnedBadgeDestIds.has(d.id) ? 'earned' : ''}">${d.badge_emoji || '🎖'}</div>`).join('');

    content.innerHTML = `
      <div class="screen active enter-left">
        <div class="top-bar">
          <div class="brand">
            <svg viewBox="0 0 40 40" class="logo-poly"><polygon points="20,2 36,20 20,38 4,20" fill="none" stroke="#D9A441" stroke-width="2"/><polygon points="20,10 30,20 20,30 10,20" fill="#C25B37"/></svg>
            <h1>Speak Rwanda</h1>
          </div>
          <button class="signout-btn" id="signout-btn">Sign out</button>
        </div>
        <p class="eyebrow">Kinyarwanda · Culture · Wildlife</p>
        <p class="intro">Unlock real Rwandan destinations by learning the words that live there.</p>
        <div class="quick-nav">
          <button class="quick-nav-btn" id="nav-nearby">📍 Nearby</button>
          <button class="quick-nav-btn" id="nav-feedback">💬 Tour feedback</button>
        </div>
        <div class="dest-list stagger">${destCardsHtml}</div>
        <div class="badge-shelf">${badgeShelfHtml}</div>
        <p class="nav-hint">Score 75%+ on a card to complete it — keep trying until you get it.</p>
      </div>`;

    document.getElementById('signout-btn').onclick = async () => { await supabase.auth.signOut(); };
    document.getElementById('nav-nearby').onclick = renderNearby;
    document.getElementById('nav-feedback').onclick = renderFeedback;
    content.querySelectorAll('.dest-card[data-dest-id]').forEach(el => { el.onclick = () => openLevel(el.dataset.destId); });
  }

  function openLevel(destId) {
    const dest = destinations.find(d => d.id === destId);
    const cards = cardsByDestination[destId] || [];

    const cardsHtml = cards.map(c => `
      <div class="word-card" data-card-id="${c.id}">
        <div class="card-inner">
          <div class="card-face card-front">
            <div class="glyph">${c.glyph || '📖'}</div>
            <div class="kiny">${c.kinyarwanda_word}</div>
          </div>
          <div class="card-face card-back">
            <div class="eng">${c.english_word}</div>
            <div class="kiny-small">${c.kinyarwanda_word}</div>
            <div class="fact">${c.fact || ''}</div>
            <div class="action-row">
              <button class="listen-btn" data-word="${c.kinyarwanda_word}" title="Hear it">🔊</button>
              <button class="mic-btn" data-card-id="${c.id}" data-word="${c.kinyarwanda_word}">🎤</button>
            </div>
            <div class="score-wrap">
              <svg class="score-ring-svg" data-ring-for="${c.id}" viewBox="0 0 22 22">
                <circle class="score-ring-bg" cx="11" cy="11" r="9"/>
                <circle class="score-ring-fg" data-ring-fg-for="${c.id}" cx="11" cy="11" r="9"/>
              </svg>
              <div class="score-line" data-score-for="${c.id}"></div>
            </div>
            <div class="retry-hint" data-retry-for="${c.id}"></div>
          </div>
        </div>
      </div>`).join('');

    content.innerHTML = `
      <div class="screen active enter-right">
        <button class="back-btn" id="back-btn">← Destinations</button>
        <p class="eyebrow">${dest.title.toUpperCase()}</p>
        <p class="intro" style="margin-bottom:10px;">${dest.description || ''}</p>
        <div class="card-grid stagger">${cardsHtml}</div>
      </div>
      <div class="overlay" id="badge-overlay">
        <div class="badge-modal" id="badge-modal-inner">
          <div class="big-medal" id="modal-emoji">🏅</div>
          <h2 id="modal-title">Badge earned!</h2>
          <p id="modal-desc"></p>
          <button class="primary-btn" id="modal-continue">Continue</button>
        </div>
      </div>`;

    document.getElementById('back-btn').onclick = renderHome;
    content.querySelectorAll('.word-card').forEach(card => { card.onclick = () => card.classList.toggle('flipped'); });
    content.querySelectorAll('.mic-btn').forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); handleScoreAttempt(dest, btn.dataset.cardId, btn.dataset.word); };
    });
    content.querySelectorAll('.listen-btn').forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); speakWord(btn.dataset.word, btn); };
    });
  }

  // Plays the target pronunciation via the browser's built-in speech synthesis.
  // Kinyarwanda voices aren't available in most browsers, so this is a
  // best-effort approximation (falls back toward French, Rwanda's other
  // official language) — not a substitute for real native-speaker audio.
  let cachedVoices = [];
  if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = () => { cachedVoices = speechSynthesis.getVoices(); };
    cachedVoices = speechSynthesis.getVoices();
  }
  function speakWord(word, btn) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(word);
    const voices = cachedVoices.length ? cachedVoices : speechSynthesis.getVoices();
    const voice = voices.find(v => v.lang?.toLowerCase().startsWith('rw'))
      || voices.find(v => v.lang?.toLowerCase().startsWith('fr'));
    if (voice) utter.voice = voice;
    utter.rate = 0.85;
    if (btn) {
      btn.classList.add('speaking');
      utter.onend = () => btn.classList.remove('speaking');
    }
    speechSynthesis.speak(utter);
  }

  const PASS_THRESHOLD = 75;
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;

  // Plain Levenshtein edit distance, turned into a 0–1 similarity score.
  function similarity(a, b) {
    a = a.toLowerCase().trim(); b = b.toLowerCase().trim();
    if (!a || !b) return 0;
    const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
    for (let j = 0; j <= b.length; j++) dp[0][j] = j;
    for (let i = 1; i <= a.length; i++) {
      for (let j = 1; j <= b.length; j++) {
        dp[i][j] = a[i - 1] === b[j - 1]
          ? dp[i - 1][j - 1]
          : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
      }
    }
    const dist = dp[a.length][b.length];
    return 1 - dist / Math.max(a.length, b.length);
  }

  async function handleScoreAttempt(dest, cardId, targetWord) {
    const btn = content.querySelector(`.mic-btn[data-card-id="${cardId}"]`);
    const cardEl = content.querySelector(`.word-card[data-card-id="${cardId}"]`);
    const retryEl = content.querySelector(`[data-retry-for="${cardId}"]`);
    if (cardEl.dataset.scored) return; // already passed — nothing more to do

    if (!SpeechRecognitionCtor) {
      retryEl.textContent = 'Speech recognition isn\'t supported in this browser — try Chrome on Android or desktop.';
      return;
    }

    const recognition = new SpeechRecognitionCtor();
    recognition.lang = 'rw-RW'; // most browsers will silently fall back to a default model
    recognition.maxAlternatives = 3;
    recognition.interimResults = false;

    btn.classList.add('listening');
    btn.textContent = '●';
    retryEl.textContent = 'Listening…';

    let finished = false;
    const finish = async (score, heardText) => {
      if (finished) return;
      finished = true;
      btn.classList.remove('listening');
      btn.textContent = '🎤';
      renderScore(cardId, score);

      await supabase.from('pronunciation_scores').insert({ user_id: session.user.id, card_id: cardId, score });

      if (score >= PASS_THRESHOLD) {
        retryEl.textContent = '';
        cardEl.dataset.scored = '1';
        const front = cardEl.querySelector('.card-front');
        const tick = document.createElement('div');
        tick.className = 'done-tick';
        tick.textContent = '✓';
        front.appendChild(tick);
        await bumpProgress(dest);
      } else {
        retryEl.textContent = heardText
          ? `Heard "${heardText}" — listen again and try once more.`
          : 'Not quite — listen again and give it another try.';
      }
    };

    recognition.onresult = (event) => {
      const alternatives = Array.from(event.results[0]).map(r => r.transcript);
      const bestMatch = alternatives.reduce((best, t) => {
        const s = similarity(t, targetWord);
        return s > best.score ? { text: t, score: s } : best;
      }, { text: alternatives[0] || '', score: -1 });
      const score = Math.round(bestMatch.score * 100);
      finish(score, bestMatch.text);
    };

    recognition.onerror = (event) => {
      btn.classList.remove('listening');
      btn.textContent = '🎤';
      retryEl.textContent = event.error === 'no-speech'
        ? 'Didn\'t catch that — try speaking clearly into the mic.'
        : event.error === 'not-allowed'
        ? 'Microphone access is blocked — allow it in your browser settings and try again.'
        : 'Mic error — try again.';
      finished = true;
    };

    recognition.onend = () => {
      btn.classList.remove('listening');
      btn.textContent = '🎤';
    };

    recognition.start();
  }

  function renderScore(cardId, score) {
    const line = content.querySelector(`[data-score-for="${cardId}"]`);
    const ringSvg = content.querySelector(`[data-ring-for="${cardId}"]`);
    const ringFg = content.querySelector(`[data-ring-fg-for="${cardId}"]`);
    const verdict = score > 90 ? 'Excellent accent!' : score > 75 ? 'Good — close to native rhythm' : 'Understandable — try the stress on the first syllable';
    const color = score > 90 ? '#3F6B4C' : score > 75 ? '#8f3f24' : '#C25B37';

    line.style.color = color;
    ringSvg.classList.add('show');
    requestAnimationFrame(() => { ringFg.style.stroke = color; ringFg.style.strokeDashoffset = 56.5 * (1 - score / 100); });

    let current = 0;
    const step = Math.max(1, Math.round(score / 20));
    const timer = setInterval(() => {
      current = Math.min(score, current + step);
      line.textContent = `${current}%`;
      if (current >= score) { clearInterval(timer); line.textContent = `${score}% · ${verdict}`; }
    }, 22);
  }

  async function bumpProgress(dest) {
    const total = (cardsByDestination[dest.id] || []).length;
    const current = (progressByDestination[dest.id] || 0) + 1;
    progressByDestination[dest.id] = current;

    await supabase.from('user_progress').upsert({
      user_id: session.user.id,
      destination_id: dest.id,
      cards_completed: current,
      completed_at: current === total ? new Date().toISOString() : null,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,destination_id' });

    if (current === total && !earnedBadgeDestIds.has(dest.id)) await awardBadge(dest);
  }

  async function awardBadge(dest) {
    const { error } = await supabase.from('user_badges').insert({ user_id: session.user.id, destination_id: dest.id });
    if (error) return;
    earnedBadgeDestIds.add(dest.id);
    showBadgeModal(dest);
  }

  function showBadgeModal(dest) {
    const overlay = document.getElementById('badge-overlay');
    const modal = document.getElementById('badge-modal-inner');
    document.getElementById('modal-emoji').textContent = dest.badge_emoji || '🏅';
    document.getElementById('modal-title').textContent = `${dest.badge_name || 'Badge'} earned!`;
    document.getElementById('modal-desc').textContent = dest.badge_description || '';
    overlay.classList.add('active');
    modal.classList.remove('pop'); void modal.offsetWidth; modal.classList.add('pop');
    fireConfetti(modal);
    document.getElementById('modal-continue').onclick = () => { overlay.classList.remove('active'); renderHome(); };
  }

  function fireConfetti(container) {
    const colors = ['#D9A441', '#C25B37', '#3F6B4C', '#F2E9D8'];
    for (let n = 0; n < 22; n++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      const angle = Math.random() * Math.PI * 2;
      const dist = 70 + Math.random() * 90;
      p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
      p.style.setProperty('--dy', `${Math.sin(angle) * dist - 40}px`);
      p.style.setProperty('--rot', `${(Math.random() * 360) | 0}deg`);
      p.style.background = colors[n % colors.length];
      p.style.animationDelay = `${Math.random() * 0.15}s`;
      container.appendChild(p);
      setTimeout(() => p.remove(), 1700);
    }
  }

  // ---------------------------------------------------------------
  // Nearby: tourism sites, restaurants, lodges relative to the user
  // ---------------------------------------------------------------
  const POI_ICONS = { park: '🌲', restaurant: '🍽️', lodge: '🏨', activity: '🚵', other: '📍' };

  function haversineKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function renderNearby() {
    content.innerHTML = `
      <div class="screen active enter-right">
        <button class="back-btn" id="back-btn">← Home</button>
        <p class="eyebrow">NEARBY</p>
        <h1 style="font-family:var(--display); font-size:20px; margin:0 0 4px;">Tourism sites &amp; restaurants</h1>
        <p class="intro" style="margin-bottom:6px;">Found relative to your current location.</p>
        <div id="nearby-body">
          <div class="location-state">Requesting your location…</div>
        </div>
      </div>`;
    document.getElementById('back-btn').onclick = renderHome;
    loadNearby();
  }

  async function loadNearby() {
    const body = document.getElementById('nearby-body');
    if (!('geolocation' in navigator)) {
      body.innerHTML = `<div class="location-state">This browser doesn't support location services.</div>`;
      return;
    }
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude } = pos.coords;
        const { data: pois, error } = await supabase.from('points_of_interest').select('*');
        if (error || !pois) {
          body.innerHTML = `<div class="location-state">Couldn't load places right now — try again shortly.</div>`;
          return;
        }
        const withDistance = pois
          .map(p => ({ ...p, distanceKm: haversineKm(latitude, longitude, p.latitude, p.longitude) }))
          .sort((a, b) => a.distanceKm - b.distanceKm);

        body.innerHTML = `<div class="poi-list">${withDistance.map(p => `
          <div class="poi-card">
            <div class="poi-icon">${POI_ICONS[p.category] || '📍'}</div>
            <div class="poi-info">
              <h3>${p.name}</h3>
              <p>${p.description || ''}</p>
              <div class="poi-distance">${p.distanceKm < 1 ? Math.round(p.distanceKm * 1000) + ' m' : p.distanceKm.toFixed(1) + ' km'} away</div>
            </div>
          </div>`).join('')}</div>`;
      },
      (err) => {
        const msg = err.code === err.PERMISSION_DENIED
          ? 'Location access was denied. Enable it in your browser settings to see nearby places.'
          : 'Couldn\'t get your location — check your device\'s location settings and try again.';
        body.innerHTML = `<div class="location-state">${msg}<br><button class="primary-btn" id="retry-location">Try again</button></div>`;
        document.getElementById('retry-location').onclick = loadNearby;
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // ---------------------------------------------------------------
  // Tour feedback: feeds guide/tour planning for the company
  // ---------------------------------------------------------------
  function renderFeedback() {
    const destOptionsHtml = destinations.map(d => `<option value="${d.title}"></option>`).join('');
    content.innerHTML = `
      <div class="screen active enter-right">
        <button class="back-btn" id="back-btn">← Home</button>
        <p class="eyebrow">TOUR FEEDBACK</p>
        <h1 style="font-family:var(--display); font-size:20px; margin:0 0 4px;">How was your experience?</h1>
        <p class="intro" style="margin-bottom:6px;">Your feedback goes straight to the tourism team for better tour and guide planning.</p>

        <div class="star-row" id="star-row">
          ${[1,2,3,4,5].map(n => `<button class="star-btn" data-star="${n}">★</button>`).join('')}
        </div>

        <input class="auth-field" id="fb-destination" list="fb-dest-list" placeholder="Which destination? (optional)" />
        <datalist id="fb-dest-list">${destOptionsHtml}</datalist>
        <input class="auth-field" id="fb-guide" placeholder="Guide's name (optional)" />
        <textarea class="feedback-textarea" id="fb-comment" placeholder="What went well? What could be better?"></textarea>
        <div class="auth-error" id="fb-error"></div>
        <button class="primary-btn" id="fb-submit">Send feedback</button>
      </div>`;

    document.getElementById('back-btn').onclick = renderHome;

    let selectedRating = 0;
    const starButtons = content.querySelectorAll('.star-btn');
    starButtons.forEach(btn => {
      btn.onclick = () => {
        selectedRating = Number(btn.dataset.star);
        starButtons.forEach(b => b.classList.toggle('active', Number(b.dataset.star) <= selectedRating));
      };
    });

    document.getElementById('fb-submit').onclick = async () => {
      const errorEl = document.getElementById('fb-error');
      errorEl.style.color = 'var(--clay)';
      if (!selectedRating) { errorEl.textContent = 'Pick a star rating first.'; return; }

      const destName = document.getElementById('fb-destination').value.trim();
      const matchedDest = destinations.find(d => d.title.toLowerCase() === destName.toLowerCase());
      const guideName = document.getElementById('fb-guide').value.trim() || null;
      const comment = document.getElementById('fb-comment').value.trim() || null;

      const { error } = await supabase.from('tour_feedback').insert({
        user_id: session.user.id,
        destination_id: matchedDest ? matchedDest.id : null,
        guide_name: guideName,
        rating: selectedRating,
        comment
      });

      if (error) { errorEl.textContent = error.message; return; }

      content.innerHTML = `
        <div class="screen active">
          <div class="feedback-success">
            <div class="big-check">🙏</div>
            <h2 style="font-family:var(--display); margin:0 0 8px;">Thank you!</h2>
            <p class="intro">Your feedback has been sent to help plan better tours and guiding.</p>
            <button class="primary-btn" id="fb-done">Back to Home</button>
          </div>
        </div>`;
      document.getElementById('fb-done').onclick = renderHome;
    };
  }
</script>
